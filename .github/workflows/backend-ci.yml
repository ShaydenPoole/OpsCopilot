name: backend-ci

# Lint, type-check, and test the Python agent service. Scoped with `paths:`
# so a frontend-only or docs-only change does not spend a backend CI run.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'evals/**'
      - 'data_pipeline/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'evals/**'
      - 'data_pipeline/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type-check (mypy)
        run: uv run mypy aviation_copilot/

      - name: Unit + integration tests
        # Integration tests use scripted FunctionModel cassettes + respx —
        # deterministic and offline. `live` tests hit real APIs and are skipped.
        run: uv run pytest -m "not live"

      - name: Eval scorer meta-tests
        run: uv run pytest -c pyproject.toml ../evals/tests
