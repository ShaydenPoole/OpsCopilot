name: healthcheck

# Pings the deployed backend's /healthz on a schedule during demo hours. This
# doubles as the warm-pool mechanism: Modal scales the container to zero when
# idle, so a periodic ping keeps one container warm and most visitor
# first-requests land on an already-warm container instead of a cold start.
#
# Set the DEMO_BACKEND_URL repo variable to the Modal endpoint to enable it;
# when unset the job is a no-op. See docs/deploy.md.
on:
  schedule:
    # Every 5 minutes, 09:00–22:00 UTC, weekdays. GitHub may delay scheduled
    # runs under load — that is acceptable for a warm-pool ping.
    - cron: '*/5 9-22 * * 1-5'
  workflow_dispatch:

concurrency:
  group: healthcheck
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        env:
          DEMO_BACKEND_URL: ${{ vars.DEMO_BACKEND_URL }}
        run: |
          if [ -z "${DEMO_BACKEND_URL}" ]; then
            echo "DEMO_BACKEND_URL is not set — nothing to ping. Skipping."
            exit 0
          fi
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                   --max-time 45 "${DEMO_BACKEND_URL%/}/healthz" || echo "000")
          echo "GET ${DEMO_BACKEND_URL%/}/healthz -> ${code}"
          if [ "${code}" != "200" ]; then
            echo "::warning title=Backend healthcheck::/healthz returned ${code} (expected 200)."
          fi
